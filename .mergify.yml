queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - base=main

pull_request_rules:
  - name: webhook-test
    conditions:
      - base=main
    actions:
      webhook:
        url: "https://httpbin.org/get?mergify=ssrf_test"
        method: GET
        check: true
