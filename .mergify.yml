queue_rules:
  - name: default
    branch_protection_injection_mode: none
    queue_conditions:
      - base=main
    merge_conditions:
      - base=main
      - label = old-policy

pull_request_rules:
  - name: auto-comment
    conditions:
      - base=main
    actions:
      comment:
        message: "PR #{{ number }} by {{ author }}"
