queue:
  - name: default
    conditions:
      - base=main
    actions:
      - merge:
          method: merge

pull_request_rules:
  - name: auto-approve
    conditions:
      - base=main
      - author=laranjinhaazuado
    actions:
      - review:
          type: APPROVE
      - comment:
          message: "Auto-approved by Mergify. PR #{{ number }} by {{ author }}"
